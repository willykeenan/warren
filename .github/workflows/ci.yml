name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # The binary-level test checks the running processes' sockets with lsof.
      WARREN_REQUIRE_LSOF: ${{ matrix.os != 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install lsof
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Gateway connector tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo check --all-targets --locked

  # Release binaries, built on a fresh runner with build paths remapped so
  # they name no directory of the machine that built them.
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          # The encoded form (flags separated by 0x1f) allows spaces in paths.
          export CARGO_ENCODED_RUSTFLAGS="$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/warren' "$HOME" "$PWD")"
          cargo build --release --locked
      - name: Check that no build path is embedded
        run: |
          if strings target/release/warren | grep -F -e "$HOME" -e "$PWD"; then
            echo "build paths found in the binary" >&2
            exit 1
          fi
      - run: tar -czf warren-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/release warren
      - uses: actions/upload-artifact@v4
        with:
          name: warren-${{ matrix.target }}
          path: warren-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  windows-binary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows x64
        shell: pwsh
        run: |
          $env:CARGO_ENCODED_RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=/build" + [char]31 + "--remap-path-prefix=$env:GITHUB_WORKSPACE=/warren" + [char]31 + "-Clink-arg=/PDBALTPATH:%_PDB%"
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check embedded paths
        shell: python
        run: |
          import os, pathlib
          binary = pathlib.Path("target/release/warren.exe").read_bytes()
          for key in ("USERPROFILE", "GITHUB_WORKSPACE"):
              for path in (os.environ[key], os.environ[key].replace("\\", "/")):
                  for encoding in ("utf-8", "utf-16-le"):
                      assert path.encode(encoding) not in binary, "build path embedded"
      - shell: pwsh
        run: Compress-Archive -Path target/release/warren.exe -DestinationPath warren-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: warren-x86_64-pc-windows-msvc
          path: warren-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

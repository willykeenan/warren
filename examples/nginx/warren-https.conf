# /etc/nginx/sites-available/warren-https  (enable with a link in /etc/nginx/sites-enabled/)
#
# One public name, relay.example.com, with a certificate from certbot. nginx terminates public TLS
# and passes everything to the warren relay on 127.0.0.1:8443 over TLS again:
#   /v1/node and /healthz  ->  the relay itself (nodes connect here)
#   every other path       ->  the published name "app" (`warren publish PORT --name app`)
# Replace relay.example.com and "app" with your names. See docs/production-relay.md.

map $http_upgrade $warren_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 32m;

    # Long-lived WebSockets: the node's connection and any the published app uses.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    # The hop to the relay is TLS too, verified against the same public certificate.
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_name relay.example.com;

    # Every location repeats the Upgrade/Connection pair on purpose. nginx inherits
    # proxy_set_header from the server level only when a location sets none, and each location
    # here sets Host, so headers set once at the server level would be dropped. Without them the
    # node's WebSocket upgrade never reaches the relay and /v1/node answers 404.

    location = /v1/node {
        proxy_ssl_server_name on;
        proxy_set_header Host relay.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $warren_connection_upgrade;
        proxy_pass https://127.0.0.1:8443;
    }

    location = /healthz {
        proxy_ssl_server_name on;
        proxy_set_header Host relay.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $warren_connection_upgrade;
        proxy_pass https://127.0.0.1:8443;
    }

    # The relay picks the published name from the Host header. It answers 421 when a TLS server
    # name (SNI) is sent and differs from Host, so this hop sends none; the relay then presents
    # its default certificate, which nginx still verifies as relay.example.com.
    location / {
        proxy_ssl_server_name off;
        proxy_set_header Host app.relay.example.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $warren_connection_upgrade;
        proxy_pass https://127.0.0.1:8443;
    }
}

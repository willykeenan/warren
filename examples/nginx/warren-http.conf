# /etc/nginx/sites-available/warren-http  (enable with a link in /etc/nginx/sites-enabled/)
#
# Port 80 answers certbot's HTTP-01 challenges from /var/lib/warren-acme and sends every other
# request to HTTPS. Replace relay.example.com with your relay's name.
server {
    listen 80;
    server_name relay.example.com;
    server_tokens off;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/lib/warren-acme;
    }
    location / {
        return 301 https://relay.example.com$request_uri;
    }
}
